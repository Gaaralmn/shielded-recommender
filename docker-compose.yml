version: '3.8'

services:
  kafka:
    image: 'confluentinc/cp-kafka:7.6.1'
    ports:
      - '9092:9092'
    environment:
      # KRaft settings for ZooKeeper-less Kafka
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://kafka:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - 'kafka_data:/var/lib/kafka/data'

  kafka-ui:
    image: 'docker.redpanda.com/redpandadata/console:v2.4.5'
    ports:
      - '${KAFKA_UI_HOST_PORT:-8081}:8080'
    depends_on:
      - kafka
    environment:
      - KAFKA_BROKERS=kafka:9092

  redis:
    image: 'redis:7.2'
    ports:
      - '6379:6379' # Standard Redis port, often left as is
    volumes:
      - 'redis_data:/data'

  # MinIO - S3-compatible object storage (Data Lake)
  minio:
    image: 'minio/minio:latest'
    ports:
      - '${MINIO_API_PORT:-9000}:9000'      # S3 API
      - '${MINIO_CONSOLE_PORT:-9001}:9001'  # Web Console
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - 'minio_data:/data'
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # MinIO client - Creates buckets on startup
  minio-setup:
    image: 'minio/mc:latest'
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb myminio/clean-events --ignore-existing;
      mc mb myminio/suspicious-events --ignore-existing;
      mc mb myminio/raw-events --ignore-existing;
      echo 'MinIO buckets created successfully';
      exit 0;
      "

  postgres:
    image: 'postgres:13'
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - 'postgres_db_data:/var/lib/postgresql/data'
      - ./postgres:/docker-entrypoint-initdb.d

  airflow-init:
    build:
      context: .
      dockerfile: ./airflow/Dockerfile
    entrypoint: /bin/bash -c "airflow db init && airflow users create --username admin --password admin --firstname admin --lastname admin --role Admin --email admin@example.com"
    depends_on:
      - postgres
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
      - AIRFLOW__CORE__LOAD_EXAMPLES=False

  airflow-webserver:
    build:
      context: .
      dockerfile: ./airflow/Dockerfile
    ports:
      - '${AIRFLOW_HOST_PORT:-8080}:8080'
    depends_on:
      - postgres
      - airflow-init
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    # Run as root for local development to access Docker socket
    # PRODUCTION: Use KubernetesPodOperator instead of DockerOperator
    user: "0:0"
    command: webserver

  airflow-scheduler:
    build:
      context: .
      dockerfile: ./airflow/Dockerfile
    depends_on:
      - postgres
      - airflow-init
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    # Run as root for local development to access Docker socket
    # PRODUCTION: Use KubernetesPodOperator instead of DockerOperator
    user: "0:0"
    command: scheduler

  mlflow-db-upgrade:
    build:
      context: .
      dockerfile: ./mlflow_custom/Dockerfile
      args:
        MLFLOW_IMAGE_TAG: ${MLFLOW_IMAGE_TAG:-v2.17.0}
    command: >
      mlflow db upgrade postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
    depends_on:
      - postgres

  mlflow:
    build:
      context: .
      dockerfile: ./mlflow_custom/Dockerfile
      args:
        MLFLOW_IMAGE_TAG: ${MLFLOW_IMAGE_TAG:-v2.17.0}
    ports:
      - '${MLFLOW_HOST_PORT:-5000}:5000'
    command: >
      mlflow server
      --backend-store-uri postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${MLFLOW_DB}
      --default-artifact-root mlflow-artifacts:/
      --artifacts-destination /mlruns
      --host 0.0.0.0
    depends_on:
      - mlflow-db-upgrade
    volumes:
      - ./mlflow_custom/mlruns:/mlruns

  # Gatekeeper API - Health checks and manual predictions
  gatekeeper-api:
    build:
      context: .
      dockerfile: ./services/gatekeeper/Dockerfile
    ports:
      - '${GATEKEEPER_HOST_PORT:-8000}:8000'
    depends_on:
      - kafka
      - redis
      - mlflow
    volumes:
      - ./services/gatekeeper/src:/app/src
      - ./recommender_schemas:/app/recommender_schemas
    environment:
      - PYTHONPATH=/app
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - START_CONSUMER=false  # API-only mode
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000"]

  # Gatekeeper Consumer - Real-time stream processing
  gatekeeper-consumer:
    build:
      context: .
      dockerfile: ./services/gatekeeper/Dockerfile
    depends_on:
      - kafka
      - redis
      - mlflow
    volumes:
      - ./services/gatekeeper/src:/app/src
      - ./recommender_schemas:/app/recommender_schemas
    environment:
      - PYTHONPATH=/app
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    command: ["python", "-m", "src.consumer"]
    restart: unless-stopped  # Auto-restart on failure

  data_producer:
    build:
      context: .
      dockerfile: ./services/data_producer/Dockerfile
    depends_on:
      - kafka
    volumes:
      - ./services/data_producer/src:/app/src
      - ./recommender_schemas:/app/recommender_schemas
      - ./data:/app/data 
    environment:
      - PYTHONPATH=/app

  trainer:
    build:
      context: .
      dockerfile: ./services/trainer/Dockerfile
    depends_on:
      - kafka
      - mlflow
    volumes:
      - ./services/trainer/src:/app/src
      - ./services/trainer/dags:/app/dags
      - ./recommender_schemas:/app/recommender_schemas
      - ./data:/app/data
    environment:
      - PYTHONPATH=/app
    # This service is only run on-demand by Airflow, so no command is needed.
    command: ["sleep", "infinity"]

  data_pipeline_worker:
    build:
      context: .
      dockerfile: ./services/data_pipeline_worker/Dockerfile
    volumes:
      - ./services/data_pipeline_worker/src:/app/src
      - ./recommender_schemas:/app/recommender_schemas
    environment:
      - PYTHONPATH=/app
    # This service is only run on-demand by Airflow, so no command is needed.
    command: ["sleep", "infinity"]

volumes:
  kafka_data:
  redis_data:
  postgres_db_data:
  mlflow_data:
  minio_data:
