version: '3.8'

services:
  kafka:
    image: 'bitnami/kafka:latest'
    ports:
      - '9092:9092'
    environment:
      # KRaft settings for ZooKeeper-less Kafka
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - ALLOW_PLAINTEXT_LISTENER=yes
    volumes:
      - 'kafka_data:/bitnami/kafka'

  kafka-ui:
    image: 'docker.redpanda.com/redpandadata/console:latest'
    ports:
      - '8081:8080'
    depends_on:
      - kafka
    environment:
      - KAFKA_BROKERS=kafka:9092

  redis:
    image: 'redis:latest'
    ports:
      - '6379:6379'
    volumes:
      - 'redis_data:/data'

  postgres:
    image: 'postgres:13'
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    volumes:
      - 'postgres_db_data:/var/lib/postgresql/data'

  airflow-init:
    build:
      context: .
      dockerfile: ./airflow/Dockerfile
    entrypoint: /bin/bash -c "airflow db init && airflow users create --username admin --password admin --firstname admin --lastname admin --role Admin --email admin@example.com"
    depends_on:
      - postgres

  airflow-webserver:
    build:
      context: .
      dockerfile: ./airflow/Dockerfile
    ports:
      - '8080:8080'
    depends_on:
      - postgres
      - airflow-init
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=False

  airflow-scheduler:
    build:
      context: .
      dockerfile: ./airflow/Dockerfile
    depends_on:
      - postgres
      - airflow-init
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=False

  mlflow:
    image: 'ghcr.io/mlflow/mlflow:v2.13.2'
    ports:
      - '5001:5000'
    command: >
      mlflow server
      --backend-store-uri postgresql://airflow:airflow@postgres/airflow
      --default-artifact-root ./mlruns
      -h 0.0.0.0
    depends_on:
      - postgres
    volumes:
      - ./mlflow:/mlruns

  gatekeeper:
    build:
      context: .
      dockerfile: ./services/gatekeeper/Dockerfile
    ports:
      - '8000:8000'
    depends_on:
      - kafka
      - redis
    volumes:
      - ./services/gatekeeper/src:/app/src
      - ./recommender_schemas:/app/recommender_schemas
    environment:
      - PYTHONPATH=/app

  data_producer:
    build:
      context: .
      dockerfile: ./services/data_producer/Dockerfile
    depends_on:
      - kafka
    volumes:
      - ./services/data_producer/src:/app/src
      - ./recommender_schemas:/app/recommender_schemas
      - ./data:/app/data 
    environment:
      - PYTHONPATH=/app

  trainer:
    build:
      context: .
      dockerfile: ./services/trainer/Dockerfile
    depends_on:
      - kafka
      - mlflow
    volumes:
      - ./services/trainer/src:/app/src
      - ./services/trainer/dags:/app/dags
      - ./recommender_schemas:/app/recommender_schemas
    environment:
      - PYTHONPATH=/app

volumes:
  kafka_data:
  redis_data:
  postgres_db_data:
